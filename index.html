<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ruota della Fortuna</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style>
  body{background:radial-gradient(circle at 50% 0%,#312e81 0%,#0f172a 55%,#020617 100%);min-height:100vh}
  .glass{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(8px)}
  #wheelWrap{position:relative;width:min(92vw,620px);aspect-ratio:1/1;margin:0 auto}
  #wheel{width:100%;height:100%;display:block;filter:drop-shadow(0 10px 30px rgba(0,0,0,.6))}
  #pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);z-index:5;filter:drop-shadow(0 3px 4px rgba(0,0,0,.6))}
  .pop{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
  @keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
  .slide{animation:slide .4s ease-out}
  @keyframes slide{from{transform:translateY(-10px);opacity:0}to{transform:none;opacity:1}}
  textarea:focus{outline:2px solid #818cf8}
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
</style>
</head>
<body class="text-slate-100 font-sans">
<canvas id="confetti"></canvas>

<div class="max-w-5xl mx-auto px-4 py-8">
  <h1 class="text-center text-3xl sm:text-5xl font-extrabold tracking-tight mb-2 bg-gradient-to-r from-amber-300 via-pink-400 to-indigo-400 bg-clip-text text-transparent">🎡 Ruota della Fortuna</h1>
  <p class="text-center text-slate-400 mb-6">Incolla i nomi, uno per riga, e fai girare la ruota.</p>

  <!-- Inserimento nomi -->
  <section id="setup" class="glass rounded-2xl p-5 mb-8">
    <label for="namesInput" class="block font-semibold mb-2">Lista dei nomi (uno sotto l'altro)</label>
    <textarea id="namesInput" rows="8" class="w-full rounded-xl bg-slate-900/70 border border-slate-700 p-3 font-mono text-sm" placeholder="MARIO ROSSI&#10;LUCA BIANCHI&#10;..."></textarea>
    <div class="flex flex-wrap gap-3 mt-3 items-center">
      <button id="loadBtn" class="px-5 py-2.5 rounded-xl bg-indigo-500 hover:bg-indigo-400 font-semibold transition">Carica nella ruota</button>
      <span id="loadInfo" class="text-sm text-slate-400"></span>
    </div>
  </section>

  <!-- Ruota -->
  <section class="mb-6">
    <div id="wheelWrap">
      <svg id="pointer" width="48" height="60" viewBox="0 0 48 60"><path d="M24 58 L4 8 Q24 -6 44 8 Z" fill="#fbbf24" stroke="#78350f" stroke-width="3" stroke-linejoin="round"/><circle cx="24" cy="17" r="5" fill="#78350f"/></svg>
      <canvas id="wheel"></canvas>
    </div>
    <div class="flex flex-wrap justify-center gap-3 mt-6">
      <button id="spinBtn" class="px-10 py-4 rounded-2xl text-xl font-extrabold bg-gradient-to-r from-amber-400 to-pink-500 text-slate-900 shadow-lg shadow-pink-500/30 hover:scale-105 active:scale-95 transition disabled:opacity-40 disabled:hover:scale-100" disabled>🎯 GIRA!</button>
      <button id="shuffleBtn" class="px-5 py-4 rounded-2xl glass hover:bg-white/10 transition font-semibold">🔀 Mescola</button>
      <button id="resetBtn" class="px-5 py-4 rounded-2xl glass hover:bg-white/10 transition font-semibold">↺ Ricomincia</button>
    </div>
    <p class="text-center text-slate-400 mt-3 text-sm">Nomi rimasti nella ruota: <b id="remaining" class="text-white">0</b></p>
  </section>

  <!-- Lista estratti -->
  <section class="glass rounded-2xl p-5">
    <div class="flex items-center justify-between mb-3 flex-wrap gap-2">
      <h2 class="text-xl font-bold">📋 Nomi usciti <span id="drawnCount" class="text-slate-400 text-base font-normal"></span></h2>
      <button id="copyBtn" class="text-sm px-4 py-2 rounded-lg bg-white/10 hover:bg-white/20 transition">Copia lista</button>
    </div>
    <ol id="drawnList" class="grid gap-2 sm:grid-cols-2"></ol>
    <p id="emptyMsg" class="text-slate-500 text-center py-4">Ancora nessun nome estratto.</p>
  </section>
</div>

<!-- Modal vincitore -->
<div id="modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/70 p-4">
  <div class="pop glass rounded-3xl p-8 sm:p-12 text-center max-w-lg w-full bg-slate-900/80">
    <div class="text-slate-400 uppercase tracking-widest text-sm mb-2">È uscito</div>
    <div id="winnerName" class="text-4xl sm:text-6xl font-black mb-6 bg-gradient-to-r from-amber-300 to-pink-400 bg-clip-text text-transparent break-words"></div>
    <button id="closeModal" class="px-8 py-3 rounded-xl bg-indigo-500 hover:bg-indigo-400 font-semibold transition">Continua</button>
  </div>
</div>

<script>
const AFTER_COUNT = 10;
const LATE_NAMES = [
  "BARBAGALLO","BRUNO","CAMPIONE","CARBONE","GANGI","LAUDANI","MASTROENI",
  "MERGIOTTI","MUNI","PASTANELLA","PLUMARI","RUSSO F","RUSSO S","SCIOLTO"
];
const norm = s => s.toUpperCase().replace(/[-.]/g,' ').replace(/\s+/g,' ').trim();
const LATE_SET = new Set(LATE_NAMES.map(norm));


/* ---------- Stato ---------- */
let wheelNames = [];   // {name, late}
let drawn = [];
let rot = 0;
let spinning = false;

const COLORS = ['#ef4444','#f97316','#eab308','#22c55e','#14b8a6','#3b82f6','#6366f1','#a855f7','#ec4899','#06b6d4','#84cc16','#f43f5e'];

const $ = id => document.getElementById(id);
const canvas = $('wheel'), ctx = canvas.getContext('2d');

function resizeCanvas(){
  const size = $('wheelWrap').clientWidth;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = size*dpr; canvas.height = size*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  drawWheel();
}
window.addEventListener('resize', resizeCanvas);

function drawWheel(){
  const size = $('wheelWrap').clientWidth;
  const c = size/2, R = c-8;
  ctx.clearRect(0,0,size,size);
  const n = wheelNames.length;

  // bordo
  ctx.beginPath(); ctx.arc(c,c,R+6,0,Math.PI*2); ctx.fillStyle='#1e1b4b'; ctx.fill();
  ctx.lineWidth=4; ctx.strokeStyle='#fbbf24'; ctx.stroke();

  if(n===0){
    ctx.beginPath(); ctx.arc(c,c,R,0,Math.PI*2); ctx.fillStyle='#1e293b'; ctx.fill();
    ctx.fillStyle='#94a3b8'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font='600 '+Math.max(16,size*.04)+'px sans-serif';
    ctx.fillText(drawn.length? 'Tutti i nomi sono usciti!' : 'Carica i nomi per iniziare', c, c);
    return;
  }

  const seg = Math.PI*2/n;
  for(let i=0;i<n;i++){
    const a0 = rot + i*seg, a1 = a0+seg;
    ctx.beginPath(); ctx.moveTo(c,c); ctx.arc(c,c,R,a0,a1); ctx.closePath();
    ctx.fillStyle = COLORS[i % COLORS.length];
    if(n>1 && n%COLORS.length===1 && i===n-1) ctx.fillStyle='#64748b';
    ctx.fill();
    if(n>1){ ctx.lineWidth=1.5; ctx.strokeStyle='rgba(255,255,255,.7)'; ctx.stroke(); }

    // testo
    ctx.save();
    ctx.translate(c,c); ctx.rotate(a0+seg/2);
    ctx.textAlign='right'; ctx.textBaseline='middle';
    let fs = Math.min(22, R*seg*0.55, size*0.045);
    fs = Math.max(fs,7);
    ctx.font='700 '+fs+'px sans-serif';
    ctx.fillStyle='#fff'; ctx.shadowColor='rgba(0,0,0,.55)'; ctx.shadowBlur=3;
    let txt = wheelNames[i].name;
    const maxW = R*0.78;
    while(ctx.measureText(txt).width>maxW && txt.length>3) txt = txt.slice(0,-2);
    if(txt!==wheelNames[i].name) txt = txt.trimEnd()+'…';
    ctx.fillText(txt, R-14, 0);
    ctx.restore();
  }
  // centro
  ctx.beginPath(); ctx.arc(c,c,R*0.09,0,Math.PI*2);
  ctx.fillStyle='#fbbf24'; ctx.fill(); ctx.lineWidth=4; ctx.strokeStyle='#78350f'; ctx.stroke();
}

/* ---------- Caricamento nomi ---------- */
function parseNames(text){
  const out=[]; const seen=new Map();
  text.split(/\r?\n/).forEach(line=>{
    let t=line.trim(); if(!t) return;
    let marked=false;
    if(/-\s*$/.test(t)){ marked=true; t=t.replace(/[-\s]+$/,'').trim(); }
    if(!t) return;
    const late = marked || LATE_SET.has(norm(t));
    out.push({name:t, late});
  });
  return out;
}

function loadNames(){
  const list = parseNames($('namesInput').value);
  if(!list.length){ $('loadInfo').textContent='Inserisci almeno un nome.'; return; }
  wheelNames = list; drawn = []; rot = 0;
  $('loadInfo').textContent = list.length+' nomi caricati ✔';
  refresh(); drawWheel();
}

function refresh(){
  $('remaining').textContent = wheelNames.length;
  $('spinBtn').disabled = spinning || wheelNames.length===0;
  $('drawnCount').textContent = drawn.length ? '('+drawn.length+')' : '';
  $('emptyMsg').style.display = drawn.length ? 'none' : 'block';
  const ol = $('drawnList'); ol.innerHTML='';
  drawn.forEach((n,i)=>{
    const li=document.createElement('li');
    li.className='flex items-center gap-3 rounded-xl bg-slate-900/60 border border-white/10 px-4 py-2'+(i===drawn.length-1?' slide':'');
    li.innerHTML='<span class="w-8 h-8 shrink-0 rounded-full bg-indigo-500/80 flex items-center justify-center text-sm font-bold">'+(i+1)+'</span><span class="font-semibold break-words"></span>';
    li.lastChild.textContent=n;
    ol.appendChild(li);
  });
}

/* ---------- Estrazione ---------- */
function pickWinnerIndex(){
  let pool;
  if(drawn.length < AFTER_COUNT){
    pool = wheelNames.map((w,i)=>({w,i})).filter(o=>!o.w.late);
    if(!pool.length) pool = wheelNames.map((w,i)=>({w,i})); // solo se non c'è altro
  } else {
    pool = wheelNames.map((w,i)=>({w,i}));
  }
  return pool[Math.floor(Math.random()*pool.length)].i;
}

function spin(){
  if(spinning || !wheelNames.length) return;
  spinning = true; $('spinBtn').disabled = true;
  const n = wheelNames.length, seg = Math.PI*2/n;
  const idx = pickWinnerIndex();
  const off = (Math.random()-0.5)*0.7; // posizione casuale dentro lo spicchio
  const desired = -Math.PI/2 - (idx+0.5+off)*seg;
  const TWO = Math.PI*2;
  let delta = (((desired-rot)%TWO)+TWO)%TWO + TWO*(6+Math.floor(Math.random()*3));
  const start = rot, dur = 5500 + Math.random()*1500, t0 = performance.now();
  const ease = t => 1-Math.pow(1-t,4);
  function frame(now){
    const t = Math.min(1,(now-t0)/dur);
    rot = start + delta*ease(t);
    drawWheel();
    if(t<1) requestAnimationFrame(frame); else finish(idx);
  }
  requestAnimationFrame(frame);
}

function finish(idx){
  const w = wheelNames.splice(idx,1)[0];
  drawn.push(w.name);
  spinning = false;
  rot = rot % (Math.PI*2);
  refresh(); drawWheel();
  $('winnerName').textContent = w.name;
  $('modal').classList.remove('hidden'); $('modal').classList.add('flex');
  launchConfetti();
}

function closeModal(){ $('modal').classList.add('hidden'); $('modal').classList.remove('flex'); }

/* ---------- Altri pulsanti ---------- */
$('loadBtn').onclick = loadNames;
$('spinBtn').onclick = spin;
$('closeModal').onclick = closeModal;
$('modal').addEventListener('click',e=>{ if(e.target===$('modal')) closeModal(); });
$('shuffleBtn').onclick = ()=>{
  if(spinning) return;
  for(let i=wheelNames.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[wheelNames[i],wheelNames[j]]=[wheelNames[j],wheelNames[i]];}
  drawWheel();
};
$('resetBtn').onclick = ()=>{
  if(spinning) return;
  if(!$('namesInput').value.trim()) return;
  wheelNames = parseNames($('namesInput').value); drawn=[]; rot=0;
  refresh(); drawWheel();
};
$('copyBtn').onclick = ()=>{
  const txt = drawn.map((n,i)=>(i+1)+'. '+n).join('\n');
  if(!txt) return;
  (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>{
    $('copyBtn').textContent='Copiata ✔'; setTimeout(()=>$('copyBtn').textContent='Copia lista',1500);
  }).catch(()=>{
    const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select();
    try{document.execCommand('copy');}catch(e){} ta.remove();
    $('copyBtn').textContent='Copiata ✔'; setTimeout(()=>$('copyBtn').textContent='Copia lista',1500);
  });
};

/* ---------- Coriandoli ---------- */
const cv = $('confetti'), cx = cv.getContext('2d');
let parts=[], anim=false;
function launchConfetti(){
  cv.width=innerWidth; cv.height=innerHeight;
  for(let i=0;i<140;i++) parts.push({x:innerWidth/2,y:innerHeight/2.4,vx:(Math.random()-.5)*16,vy:-Math.random()*14-2,s:Math.random()*8+4,c:COLORS[i%COLORS.length],r:Math.random()*6,vr:(Math.random()-.5)*.4,life:150});
  if(!anim){anim=true;requestAnimationFrame(tick);}
}
function tick(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts=parts.filter(p=>p.life>0);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.r+=p.vr;p.life--;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.globalAlpha=Math.min(1,p.life/40);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore();});
  if(parts.length) requestAnimationFrame(tick); else {anim=false;cx.clearRect(0,0,cv.width,cv.height);}
}

resizeCanvas(); refresh();
</script>
</body>
</html>
